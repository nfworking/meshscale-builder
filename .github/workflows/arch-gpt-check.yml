name: Arch GPT builder checks

on:
  push:
    branches:
      - arch/gpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format source
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runner.rs src/function_entry.cjs
          git commit -m "style: format builder runtime"
          git push
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Compile
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
