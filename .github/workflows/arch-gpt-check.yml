name: Arch GPT builder checks

on:
  push:
    branches:
      - arch/gpt
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node syntax
        run: for file in src/*.cjs test/runtime/*.cjs test/golden/*.cjs; do node --check "$file"; done
      - name: Node runtime tests
        run: node --test test/runtime/*.test.cjs
      - name: Compile
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
