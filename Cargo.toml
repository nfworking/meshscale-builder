[package]
name = "meshscale-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
git2 = { version = "0.21", features = ["https", "vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"
zip = { version = "8.6", default-features = false, features = ["deflate", "time"] }
